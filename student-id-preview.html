<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student ID interaction preview</title>
<style>
:root{--ink:#151515;--muted:#77736d;--paper:#f7f6f2;--card:#fdfdfb;--red:#e52c35;--blue:#0759a8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center;overflow-x:hidden}.page{width:min(1120px,92vw);min-height:680px;display:grid;grid-template-columns:1fr 1.05fr;align-items:center;gap:70px;padding:46px 0}.back{position:fixed;top:26px;left:4vw;color:#86837d;text-decoration:none;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em}.eyebrow,.hint{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em;color:#8a8780}.copy h1{font-size:clamp(48px,7vw,86px);line-height:.9;letter-spacing:-.075em;max-width:470px;margin:20px 0 28px}.copy p{max-width:340px;color:#66635e;line-height:1.65;font-size:15px}.hint{margin-top:48px}.stage{min-height:650px;position:relative;display:grid;place-items:center;touch-action:none}.dynamic-id{position:relative;width:min(390px,100%);aspect-ratio:2/3;cursor:grab;touch-action:none;user-select:none}.design-reference{--x:0px;--y:0px;--angle:0deg;display:block;width:100%;height:100%;object-fit:fill;transform:translate3d(var(--x),var(--y),0) rotate(var(--angle));transform-origin:50% 7%;pointer-events:none;will-change:transform;filter:drop-shadow(0 18px 16px rgba(20,20,20,.08))}.dynamic-id.is-dragging{cursor:grabbing;filter:drop-shadow(0 26px 22px rgba(20,20,20,.14))}.lanyard{position:absolute;top:0;left:50%;width:180px;height:215px;transform:translateX(-50%);pointer-events:none}.lanyard:before,.lanyard:after{content:"";position:absolute;top:0;width:22px;height:220px;border:0;transform:rotate(-10deg);transform-origin:top center;border-radius:0 0 18px 18px;background:var(--blue)}.lanyard:before{left:38px}.lanyard:after{right:38px;transform:rotate(10deg);transform-origin:top center;background:var(--red)}.clip{position:absolute;top:196px;left:50%;width:48px;height:36px;transform:translateX(-50%);border:3px solid var(--ink);border-radius:14px 14px 9px 9px;background:var(--paper);z-index:2}.clip:after{content:"";position:absolute;left:18px;top:26px;width:10px;height:28px;border:3px solid var(--ink);border-top:0;border-radius:0 0 7px 7px}.badge{--rx:0deg;--ry:0deg;--lift:0px;position:absolute;top:228px;width:250px;height:330px;border:2px solid var(--ink);border-radius:13px;background:linear-gradient(145deg,var(--card) 0 84%,var(--blue) 84% 91%,var(--red) 91% 100%);padding:22px 20px 18px;transform:translateY(var(--lift)) rotate(var(--rot,0deg)) rotateX(var(--rx)) rotateY(var(--ry));transform-origin:50% 0;box-shadow:12px 16px 0 rgba(21,21,21,.05);transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease;cursor:grab;user-select:none}.badge.is-dragging{cursor:grabbing;transition:none;box-shadow:18px 22px 0 rgba(21,21,21,.09)}.badge:before{content:"";position:absolute;top:-14px;left:50%;width:30px;height:28px;transform:translateX(-50%);border:2px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0;background:var(--card)}.hole{position:absolute;top:10px;left:50%;width:10px;height:10px;transform:translateX(-50%);border:2px solid var(--ink);border-radius:50%;background:var(--paper)}.photo{height:174px;border:1px solid #bbb9b3;border-radius:8px;overflow:hidden;background:#eee;margin-bottom:15px}.photo img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block}.rule{height:1px;background:#deddd8;margin:0 0 14px}.logo{width:145px;height:39px;object-fit:contain;object-position:left center;display:block;margin:0 auto 10px}.badge-note{font:9px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:center;letter-spacing:.08em;color:#77736d}.status{position:absolute;right:18px;bottom:32px;display:flex;align-items:center;gap:8px;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;color:#888}.status i{width:7px;height:7px;border-radius:50%;background:#43a269}.spark{position:absolute;inset:auto 7% 3% auto;width:90px;height:90px;border:1px solid #dedbd2;border-radius:50%;opacity:.7}.spark:before,.spark:after{content:"";position:absolute;inset:18px;border:1px solid #dedbd2;border-radius:50%}.spark:after{inset:34px}.drag-label{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);font:10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.1em;color:#8c8982;white-space:nowrap}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);opacity:0;background:#151515;color:#fff;padding:11px 15px;border-radius:999px;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;transition:.25s ease}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.page{grid-template-columns:1fr;gap:0;padding:80px 0 35px}.copy h1{font-size:58px;margin:15px 0 20px}.hint{margin-top:25px}.stage{height:505px;margin-top:12px}.badge{transform:translateY(var(--lift)) rotate(var(--rot,0deg)) rotateX(var(--rx)) rotateY(var(--ry)) scale(.9);top:195px}.lanyard{transform:translateX(-50%) scale(.9);top:-8px}.clip{top:176px}.spark{right:0}}
@media(prefers-reduced-motion:reduce){.badge{transition:none}.design-reference{transition:none}}
</style></head>
<body>
<a class="back" href="index.html">PORTFOLIO / INTERACTION STUDY</a>
<main class="page"><section class="copy"><span class="eyebrow">STUDENT ID / INTERACTION STUDY</span><h1>A small proof of who I am.</h1><p>A personal visual for the portfolio: my student identity, held lightly between the academic world and the work I am building.</p><p class="hint">CLICK OR DRAG THE CARD</p></section><section class="stage" aria-label="D student ID card design"><div class="dynamic-id" id="dynamicId" aria-label="Interactive student ID and lanyard"><img class="design-reference" id="designReference" src="portfolio-assets/student-id-design-d.png?v=d2" alt="MMU student ID card with connected blue and red lanyard"></div></section></main><div class="toast" id="toast">still me, just moving</div>
<script>
const dynamicId=document.querySelector('#dynamicId');const designReference=document.querySelector('#designReference');
let dragging=false,startX=0,startY=0,baseX=0,baseY=0;const state={x:0,y:0,angle:0,vx:0,vy:0,va:0,targetX:0,targetY:0,targetAngle:0};
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function paint(){designReference.style.setProperty('--x',state.x.toFixed(2)+'px');designReference.style.setProperty('--y',state.y.toFixed(2)+'px');designReference.style.setProperty('--angle',state.angle.toFixed(2)+'deg')}
function tick(){const stiffness=dragging?.25:.07;state.vx+=(state.targetX-state.x)*stiffness;state.vy+=(state.targetY-state.y)*stiffness;state.va+=(state.targetAngle-state.angle)*stiffness;state.vx*=.82;state.vy*=.82;state.va*=.82;state.x+=state.vx;state.y+=state.vy;state.angle+=state.va;paint();if(!reduced)requestAnimationFrame(tick)}
dynamicId.addEventListener('pointermove',e=>{const r=dynamicId.getBoundingClientRect();const nx=(e.clientX-(r.left+r.width/2))/(r.width/2);if(!dragging){state.targetX=Math.max(-8,Math.min(8,nx*5));state.targetY=Math.max(-3,Math.min(3,((e.clientY-r.top)/r.height-.5)*3));state.targetAngle=Math.max(-3,Math.min(3,nx*2.4))}else{state.targetX=baseX+(e.clientX-startX)*.28;state.targetY=baseY+(e.clientY-startY)*.2;state.targetAngle=(e.clientX-startX)*.06}});
dynamicId.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX;startY=e.clientY;baseX=state.x;baseY=state.y;dynamicId.classList.add('is-dragging');dynamicId.setPointerCapture(e.pointerId);e.preventDefault()});
function release(){dragging=false;dynamicId.classList.remove('is-dragging');state.targetX=0;state.targetY=0;state.targetAngle=0}dynamicId.addEventListener('pointerup',release);dynamicId.addEventListener('pointercancel',release);dynamicId.addEventListener('pointerleave',()=>{if(!dragging){state.targetX=0;state.targetY=0;state.targetAngle=0}});
paint();if(!reduced)requestAnimationFrame(tick);
</script></body></html>
